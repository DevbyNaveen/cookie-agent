[package]
name = "cookie-tools"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A stdio MCP server that makes and edits spreadsheets, documents, pages and CSV files inside allowed folders."
publish = false

[[bin]]
name = "cookie-tools"
path = "src/main.rs"

[dependencies]
ammonia = "=4.2.3"
calamine = "=0.36.1"
docx-rs = { version = "=0.4.22", default-features = false }
quick-xml = "=0.41.0"
rust_xlsxwriter = "=0.99.1"
serde_json = "=1.0.154"
umya-spreadsheet = "=3.1.1"
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "=3.27.0"

[profile.release]
strip = true
lto = "thin"
