[project]
name = "cookie-harness"
version = "0.1.0"
description = "Python client for the Cookie Agent Harness (`cookie serve`)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
