[package]
name = "cookie-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "Cookie for the desktop: a team of focused agents, each with its own walls."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-notification = "2"
# The Stop key: every agent stops, from anywhere on the Mac.
tauri-plugin-global-shortcut = "2"
cookie-team = { path = "../team" }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt-multi-thread"] }
tokio-util = "0.7"
