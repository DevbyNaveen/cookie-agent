[package]
name = "cookie-relay"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "The Cookie Network relay: holds signed profiles, carries sealed messages it cannot read, and serves public agent cards with guest chat."

[[bin]]
name = "cookie-relay"
path = "src/main.rs"

[dependencies]
cookie-net = { path = "../net" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
