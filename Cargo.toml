[package]
name = "cookie-harness"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/DevbyNaveen/cookie-agent"
description = "A tiny agent loop where text the model read can never decide who gets sent what."
# The page, the Mac app and the evals live beside the crate, not in it.
exclude = ["mac/", "web/", "evals/"]

[features]
default = []
# Amazon Bedrock (Converse API), signed with SigV4.
# Needs Rust 1.91+. The AWS crates are pinned to the versions Enkeon's
# gateway runs in production; newer releases need Rust 1.94.
bedrock = ["dep:aws-sigv4", "dep:aws-credential-types", "dep:aws-smithy-async", "dep:aws-smithy-http", "dep:aws-smithy-runtime-api", "dep:aws-smithy-types"]

[dependencies]
async-trait = "0.1"
base64 = "0.22"
# `cookie page`: the page and its answers on 127.0.0.1 (already in the tree through reqwest).
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
aws-credential-types = { version = "=1.2.13", optional = true }
aws-sigv4 = { version = "=1.4.1", optional = true }
aws-smithy-async = { version = "=1.2.13", optional = true }
aws-smithy-http = { version = "=0.63.5", optional = true }
aws-smithy-runtime-api = { version = "=1.11.5", optional = true }
aws-smithy-types = { version = "=1.4.5", optional = true }
futures = "0.3"
# Signing `trace` logs (Ed25519) and their keys' randomness: already in the
# tree through rustls, so no new crate is built.
ring = { version = "0.17", default-features = false }
# The public suffix list, for DMARC alignment (cookie::mail::org_domain).
psl = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "io-std", "signal", "sync", "time", "process"] }
tokio-util = "0.7"
tracing = "0.1"
# `cookie serve` logs JSON to stderr (spans with timings and token counts, never content).
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "env-filter", "std", "registry"] }
url = "2"

[dev-dependencies]
tempfile = "3"

# `cookie page`: this computer's own time zone, for when routines are due.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
